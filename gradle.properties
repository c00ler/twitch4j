# release properties
group=com.github.twitch4j
version=0.0.0

# Keep a warm JVM between builds to avoid per-build startup cost
org.gradle.daemon=true

# JVM args for the Gradle daemon; G1GC handles large heaps (3g) better than the default collector
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Execute independent subproject tasks concurrently (15 modules benefit significantly)
org.gradle.parallel=true

# Cache task outputs locally so unchanged tasks are UP-TO-DATE on subsequent builds
org.gradle.caching=true

# Only recompile Kotlin files that changed and their dependents
kotlin.incremental=true

# Give the Kotlin compiler daemon its own heap budget with G1GC
kotlin.daemon.jvm.options=-Xmx1g -XX:+UseG1GC
