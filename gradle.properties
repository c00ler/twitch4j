# release properties
group=com.github.twitch4j
version=0.0.0

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ============================================================
# Gradle Build Optimizations
# ============================================================

# Enable the Gradle build cache: task outputs are stored locally and reused on
# subsequent builds when inputs have not changed. This is the single biggest
# win for incremental and CI builds.
org.gradle.caching=true

# Execute independent subproject tasks in parallel, exploiting all available
# CPU cores. With 16 modules this can cut wall-clock time significantly.
org.gradle.parallel=true

# Keep the Gradle daemon alive between builds so the JVM and class-loading
# overhead is paid only once per developer session.
org.gradle.daemon=true

# Let Gradle watch the file system for changes rather than polling on every
# build, reducing unnecessary I/O during incremental builds.
org.gradle.vfs.watch=true

# Kotlin incremental compilation: only recompile Kotlin source files that have
# actually changed, rather than recompiling the whole module.
kotlin.incremental=true
